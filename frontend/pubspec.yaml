name: safetify
description: "A real-time crowdsourced incident reporting and safety alert mobile application."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2


dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.0
  share_plus: ^12.0.1

  google_fonts: ^6.3.2
  google_maps_flutter: ^2.2.0
  location: ^8.0.1
  image_picker: ^1.2.0
  http: ^1.5.0
  shared_preferences: ^2.1.1

  #---------------------------
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

  #for non-api map
  # flutter_map: ^7.0.0
  # latlong2: ^0.9.0
  # geolocator: ^13.0.0
  # permission_handler: ^11.3.0
  # #---------------------------

  cupertino_icons: ^1.0.8
  cloud_firestore: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0






# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/fire.jpg
    - assets/images/thugs.jpg
    - assets/images/flood.jpg
    - assets/images/traffic.jpg
    - assets/images/profile.jpg
    - assets/images/a.png
    - assets/images/b.png
    - assets/images/c.png
    - assets/images/d.png

